<div class="selector" role="group" [attr.aria-label]="etiqueta">
  @for (opcion of opciones; track opcion.valor) {
    <button
      type="button"
      class="selector__opcion"
      [class.selector__opcion--activa]="opcion.valor === valor"
      [attr.aria-pressed]="opcion.valor === valor"
      (click)="elegir(opcion.valor)"
    >
      {{ opcion.etiqueta }}
    </button>
  }
</div>
