<article class="tarjeta-animal">
 <div
 class="tarjeta-animal__foto"
 [style.background-image]="fotoUrl ? 'url(' + fotoUrl + ')' :
null"
 aria-hidden="true">
 </div>
 <div class="tarjeta-animal__info">
 <h3 class="tarjeta-animal__nombre">{{ nombre }}</h3>
 <p class="tarjeta-animal__detalle">{{ especie }} · {{ edad
}}</p>
 <a class="tarjeta-animal__boton" aria-disabled="true"
tabindex="-1">{{ textoBoton }}</a>
 </div>
</article>
