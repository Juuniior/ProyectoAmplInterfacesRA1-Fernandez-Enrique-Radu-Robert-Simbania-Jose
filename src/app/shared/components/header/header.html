
<header class="cabecera">
  <div class="cabecera__fila">

    <a routerLink="/home" class="cabecera__marca">
      <span class="cabecera__logo" aria-hidden="true">€</span>
      <span class="cabecera__titulo">ContaLite</span>
    </a>

    <input
      type="checkbox"
      id="cabecera-toggle"
      class="cabecera__toggle-input"
    >

    <label
      for="cabecera-toggle"
      class="cabecera__toggle-boton"
      aria-label="Abrir menú"
    >
      <span></span>
      <span></span>
      <span></span>
    </label>

    <nav class="cabecera__nav" aria-label="Navegación principal">

      <a
        routerLink="/home"
        routerLinkActive="cabecera__enlace--activo"
        class="cabecera__enlace"
      >
        Inicio
      </a>

      <a
        routerLink="/movimientos"
        routerLinkActive="cabecera__enlace--activo"
        class="cabecera__enlace"
      >
        Movimientos
      </a>

      <a class="cabecera__enlace-deshabilitado"
         aria-disabled="true" tabindex="-1">
        Facturas
      </a>

      <a class="cabecera__enlace-deshabilitado"
         aria-disabled="true" tabindex="-1">
        Informes
      </a>

      <a
        routerLink="/login"
        routerLinkActive="cabecera__enlace--activo"
        class="cabecera__enlace cabecera__enlace--acceso"
      >
        Acceso
      </a>

    </nav>
  </div>
</header>
